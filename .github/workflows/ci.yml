name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  runtime:
    name: Runtime checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version-file: services/agent-runtime/pyproject.toml
          enable-cache: false
      - name: Install locked Runtime dependencies
        working-directory: services/agent-runtime
        run: uv sync --locked
      - name: Lint, format and types
        working-directory: services/agent-runtime
        run: |
          uv run --locked ruff check src tests
          uv run --locked ruff format --check src tests
          uv run --locked pyright
      - name: Unit and isolated execution tests
        working-directory: services/agent-runtime
        run: uv run --locked pytest tests/unit tests/execution --tb=short --show-capture=no

  contracts:
    name: Scripts and deployment contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version-file: services/agent-runtime/pyproject.toml
          enable-cache: false
      - name: Install locked dependencies
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          npm ci
          uv sync --project services/agent-runtime --locked
      - name: Install the repository's kubectl pin
        run: |
          version="$(node -p 'require("./deploy/kind/versions.json").kubectl')"
          tool_dir="$RUNNER_TEMP/incident-kubectl"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 "https://dl.k8s.io/release/$version/bin/linux/amd64/kubectl" --output "$tool_dir/kubectl"
          curl --fail --silent --show-error --location --retry 3 "https://dl.k8s.io/release/$version/bin/linux/amd64/kubectl.sha256" --output "$tool_dir/kubectl.sha256"
          (cd "$tool_dir"; printf '%s  kubectl\n' "$(<kubectl.sha256)" | sha256sum --check --strict)
          chmod 755 "$tool_dir/kubectl"
          "$tool_dir/kubectl" version --client --output=json
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      - name: Fetch the locked promtool image
        run: |
          image="$(node --input-type=module -e 'import fs from "node:fs"; import {load} from "js-yaml"; const k = load(fs.readFileSync("deploy/monitoring/base/workloads/kustomization.yaml", "utf8")); const i = k.images.find(i => i.name === "quay.io/prometheus/prometheus"); console.log(`${i.newName}@${i.digest}`)')"
          docker pull "$image"
          docker image inspect "$image" --format '{{.Id}}'
      - name: Script contracts, Kustomize and promtool
        run: node --test 'scripts/*.test.mjs'
      - name: OpenAPI and generated types drift
        run: npm run openapi:check

  web:
    name: Console checks and fake E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked Web dependencies
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          npm ci
      - name: Lint, types and component tests
        run: |
          npm run lint
          npx next typegen
          npx tsc --noEmit
          npx vitest run
      - name: Production build
        run: npm run build
      - name: Fake E2E on the existing Chrome channel
        run: |
          google-chrome --version
          npm run test:e2e

  docs-security:
    name: Public docs and CI security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install isolated locked documentation tools
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          npm ci --prefix .github/ci --ignore-scripts
          bash .github/ci/install-tools.sh
      - name: Workflow syntax and contribution boundary
        run: |
          # Do not implicitly enable an unpinned runner-provided ShellCheck.
          actionlint -shellcheck=""
          bash -n .github/ci/install-tools.sh
          npm test --prefix .github/ci
          node .github/ci/check-policy.mjs
      - name: Scan fetched Git history with redacted findings
        run: gitleaks git --redact=100 --no-banner --no-color --ignore-gitleaks-allow --gitleaks-ignore-path .github/ci/gitleaksignore --log-opts=--all .
      - name: Public links and actual Mermaid render
        run: node .github/ci/check-docs.mjs --render
