name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  runtime:
    name: Runtime checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version-file: services/agent-runtime/pyproject.toml
          enable-cache: false
      - name: Install locked Runtime dependencies
        working-directory: services/agent-runtime
        run: uv sync --locked
      - name: Lint, format and types
        working-directory: services/agent-runtime
        run: |
          uv run --locked ruff check src tests
          uv run --locked ruff format --check src tests
          uv run --locked pyright
      - name: Unit and isolated execution tests
        working-directory: services/agent-runtime
        run: uv run --locked pytest tests/unit tests/execution --tb=short --show-capture=no
      - name: Candidate startup fixture against the locked Kubernetes SDK
        working-directory: services/agent-runtime
        run: |
          uv run --locked ruff check --config ../../.github/ci/ruff.toml ../../.github/ci/smoke-runtime.py ../../.github/ci/smoke-runtime.test.py
          uv run --locked ruff format --config ../../.github/ci/ruff.toml --check ../../.github/ci/smoke-runtime.py ../../.github/ci/smoke-runtime.test.py
          uv run --locked pyright --project pyproject.toml ../../.github/ci/smoke-runtime.py ../../.github/ci/smoke-runtime.test.py
          uv run --locked python ../../.github/ci/smoke-runtime.test.py
      - name: Bounded publication archive importer
        working-directory: services/agent-runtime
        run: |
          uv run --locked ruff check --config pyproject.toml ../../scripts/release-archive.py ../../scripts/release-archive.test.py
          uv run --locked ruff format --config pyproject.toml --check ../../scripts/release-archive.py ../../scripts/release-archive.test.py
          uv run --locked python ../../scripts/release-archive.test.py

  contracts:
    name: Scripts and deployment contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version-file: services/agent-runtime/pyproject.toml
          enable-cache: false
      - name: Install locked dependencies
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          npm ci
          uv sync --project services/agent-runtime --locked
      - name: Install the repository's kubectl pin
        run: |
          version="$(node -p 'require("./deploy/kind/versions.json").kubectl')"
          tool_dir="$RUNNER_TEMP/incident-kubectl"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 "https://dl.k8s.io/release/$version/bin/linux/amd64/kubectl" --output "$tool_dir/kubectl"
          curl --fail --silent --show-error --location --retry 3 "https://dl.k8s.io/release/$version/bin/linux/amd64/kubectl.sha256" --output "$tool_dir/kubectl.sha256"
          (cd "$tool_dir"; printf '%s  kubectl\n' "$(<kubectl.sha256)" | sha256sum --check --strict)
          chmod 755 "$tool_dir/kubectl"
          "$tool_dir/kubectl" version --client --output=json
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      - name: Fetch the locked promtool image
        run: |
          image="$(node --input-type=module -e 'import fs from "node:fs"; import {load} from "js-yaml"; const k = load(fs.readFileSync("deploy/monitoring/base/workloads/kustomization.yaml", "utf8")); const i = k.images.find(i => i.name === "quay.io/prometheus/prometheus"); console.log(`${i.newName}@${i.digest}`)')"
          docker pull "$image"
          docker image inspect "$image" --format '{{.Id}}'
      - name: Script contracts, Kustomize and promtool
        run: |
          export PATH="$PWD/services/agent-runtime/.venv/bin:$PATH"
          node --test 'scripts/*.test.mjs'
      - name: OpenAPI and generated types drift
        run: npm run openapi:check

  web:
    name: Console checks and fake E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked Web dependencies
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          npm ci
      - name: Lint, types and component tests
        run: |
          npm run lint
          npx next typegen
          npx tsc --noEmit
          npx vitest run
      - name: Production build
        run: npm run build
      - name: Fake E2E on the existing Chrome channel
        run: |
          google-chrome --version
          npm run test:e2e

  docs-security:
    name: Public docs and CI security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install isolated locked documentation tools
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          npm ci --prefix .github/ci --ignore-scripts
          bash .github/ci/install-tools.sh
      - name: Workflow syntax and contribution boundary
        run: |
          # Do not implicitly enable an unpinned runner-provided ShellCheck.
          actionlint -shellcheck=""
          bash -n .github/ci/install-tools.sh
          npm test --prefix .github/ci
          node .github/ci/check-policy.mjs
      - name: Scan fetched Git history with redacted findings
        run: gitleaks git --redact=100 --no-banner --no-color --ignore-gitleaks-allow --gitleaks-ignore-path .github/ci/gitleaksignore --log-opts=--all .
      - name: Public links and actual Mermaid render
        run: node .github/ci/check-docs.mjs --render

  candidate:
    name: Same-source multi-platform OCI candidate
    needs: [runtime, contracts, web, docs-security]
    if: github.repository == 'kkxiaoa/k8s-incident-agent' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Read committed build tool pins
        id: tools
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pins = JSON.parse(fs.readFileSync('.github/ci/release-tools.json', 'utf8'));
          for (const key of ['buildx', 'buildkit', 'qemu']) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${pins[key]}\n`);
          NODE
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ steps.tools.outputs.qemu }}
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ steps.tools.outputs.buildx }}
          driver: docker-container
          driver-opts: image=${{ steps.tools.outputs.buildkit }}
          cache-binary: false
      - name: Build both images once from the exact committed export
        run: node scripts/release.mjs build --output "$RUNNER_TEMP/incident-bundle"
      - name: Start both exact candidate platforms in isolation
        run: node scripts/release-smoke.mjs --release "$RUNNER_TEMP/incident-bundle/release.json"
      - name: Package only verified release content
        run: node scripts/release.mjs pack --release "$RUNNER_TEMP/incident-bundle/release.json" --output "$RUNNER_TEMP/incident-candidate"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/incident-candidate/candidate.tar.gz
            ${{ runner.temp }}/incident-candidate/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
