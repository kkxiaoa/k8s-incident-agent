apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-pull-backoff
  namespace: k8s-incident-scenarios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-pull-backoff
  template:
    metadata:
      labels:
        app: image-pull-backoff
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workload
          image: registry.invalid/k8s-incident-agent/missing:v1
          imagePullPolicy: IfNotPresent
          args: ["pause"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
