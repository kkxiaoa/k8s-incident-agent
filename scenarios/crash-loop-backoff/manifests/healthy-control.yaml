apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-loop-backoff-healthy-control
  namespace: k8s-incident-scenarios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crash-loop-backoff-healthy-control
  template:
    metadata:
      labels:
        app: crash-loop-backoff-healthy-control
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workload
          image: registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
          imagePullPolicy: IfNotPresent
          args: ["pause"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
