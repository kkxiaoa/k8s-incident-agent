apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-executor-egress
  namespace: k8s-incident-agent
  labels:
    app.kubernetes.io/part-of: k8s-incident-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sandbox-executor
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runtime
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-executor-to-runtime
  namespace: k8s-incident-agent
  labels:
    app.kubernetes.io/part-of: k8s-incident-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sandbox-executor
      ports:
        - protocol: TCP
          port: 8000
