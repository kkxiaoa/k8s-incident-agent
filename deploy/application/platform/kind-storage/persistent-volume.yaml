apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8s-incident-agent-runtime-data
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: k8s-incident-agent
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: k8s-incident-agent-kind
  volumeMode: Filesystem
  hostPath:
    path: /var/local/k8s-incident-agent
    type: DirectoryOrCreate
