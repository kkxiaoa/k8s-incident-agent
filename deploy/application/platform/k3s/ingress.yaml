apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: incident-console
  namespace: k8s-incident-agent
  labels:
    app.kubernetes.io/name: incident-console
    app.kubernetes.io/part-of: k8s-incident-agent
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: incident-console
                port:
                  name: http
