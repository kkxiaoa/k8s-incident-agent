apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: incident-console
  namespace: k8s-incident-agent
  labels:
    app.kubernetes.io/name: incident-console
    app.kubernetes.io/part-of: k8s-incident-agent
spec:
  ingressClassName: traefik
  # Only the public host: a rule without a host also answers requests to the
  # node address and outranks neighbouring IngressRoutes on the same Traefik.
  tls:
    - hosts:
        - incident.kubesmith.cloud
      secretName: incident-console-tls
  rules:
    - host: incident.kubesmith.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: incident-console
                port:
                  name: http
