apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patch-validator-dry-run
  namespace: k8s-incident-scenarios
  labels:
    app.kubernetes.io/name: patch-validator
    app.kubernetes.io/part-of: k8s-incident-agent
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patch-validator-dry-run
  namespace: k8s-incident-scenarios
  labels:
    app.kubernetes.io/name: patch-validator
    app.kubernetes.io/part-of: k8s-incident-agent
subjects:
  - kind: ServiceAccount
    name: patch-validator
    namespace: k8s-incident-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: patch-validator-dry-run
