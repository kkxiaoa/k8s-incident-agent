apiVersion: v1
kind: Service
metadata:
  name: incident-console
  namespace: k8s-incident-agent
  labels:
    app.kubernetes.io/name: incident-console
    app.kubernetes.io/part-of: k8s-incident-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: incident-console
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: agent-runtime
  namespace: k8s-incident-agent
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: k8s-incident-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-runtime
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: patch-validator
  namespace: k8s-incident-agent
  labels:
    app.kubernetes.io/name: patch-validator
    app.kubernetes.io/part-of: k8s-incident-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: patch-validator
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: http
