apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-gateway
  namespace: k8s-incident-agent
  labels:
    app.kubernetes.io/name: deploy-gateway
    app.kubernetes.io/part-of: k8s-incident-agent
automountServiceAccountToken: false
---
# Runs the gateway's prefetch and backup Jobs; it holds no API permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-jobs
  namespace: k8s-incident-agent
  labels:
    app.kubernetes.io/name: deploy-jobs
    app.kubernetes.io/part-of: k8s-incident-agent
automountServiceAccountToken: false
