apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../k3s-base
patches:
  - path: console-online.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: incident-console
      namespace: k8s-incident-agent
  - path: runtime-online.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: agent-runtime
      namespace: k8s-incident-agent
