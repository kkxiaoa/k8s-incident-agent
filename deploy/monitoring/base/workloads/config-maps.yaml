apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: k8s-incident-monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: k8s-incident-agent
data:
  prometheus.yaml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s
      external_labels:
        cluster: k8s-incident-agent
    storage:
      tsdb:
        retention:
          time: 15d
          size: 1600MB
    rule_files:
      - /etc/prometheus/rules/*.yaml
    alerting:
      alertmanagers:
        - api_version: v2
          static_configs:
            - targets:
                - alertmanager.k8s-incident-monitoring.svc.cluster.local:9093
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["127.0.0.1:9090"]
        body_size_limit: 2MB
        sample_limit: 10000
        label_limit: 64
        label_name_length_limit: 128
        label_value_length_limit: 512
      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics.k8s-incident-monitoring.svc.cluster.local:8080
        body_size_limit: 16MB
        sample_limit: 50000
        label_limit: 64
        label_name_length_limit: 128
        label_value_length_limit: 512
      - job_name: kube-state-metrics-telemetry
        static_configs:
          - targets:
              - kube-state-metrics.k8s-incident-monitoring.svc.cluster.local:8081
        body_size_limit: 2MB
        sample_limit: 10000
        label_limit: 64
        label_name_length_limit: 128
        label_value_length_limit: 512
      - job_name: alertmanager
        static_configs:
          - targets:
              - alertmanager.k8s-incident-monitoring.svc.cluster.local:9093
        body_size_limit: 2MB
        sample_limit: 10000
        label_limit: 64
        label_name_length_limit: 128
        label_value_length_limit: 512
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: k8s-incident-monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: k8s-incident-agent
data:
  alerts.yaml: |
    groups:
      - name: k8s-incident-agent
        rules:
          - alert: Watchdog
            expr: vector(1)
            labels:
              severity: none
          - alert: K8sIncidentImagePullBackOff
            expr: >-
              max by (namespace, deployment) (
                max by (namespace, pod) (
                  kube_pod_container_status_waiting_reason{reason=~"ErrImagePull|ImagePullBackOff"} == 1
                )
                * on (namespace, pod) group_left(replicaset)
                  label_replace(
                    kube_pod_owner{owner_kind="ReplicaSet",owner_is_controller="true"},
                    "replicaset", "$1", "owner_name", "(.+)"
                  )
                * on (namespace, replicaset) group_left(deployment)
                  label_replace(
                    kube_replicaset_owner{owner_kind="Deployment",owner_is_controller="true"},
                    "deployment", "$1", "owner_name", "(.+)"
                  )
              ) > 0
            for: 30s
            labels:
              severity: warning
          - alert: K8sIncidentCrashLoopBackOff
            expr: >-
              max by (namespace, deployment) (
                max by (namespace, pod) (
                  (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1)
                  * on (namespace, pod, container)
                    (kube_pod_container_status_restarts_total > 0)
                )
                * on (namespace, pod) group_left(replicaset)
                  label_replace(
                    kube_pod_owner{owner_kind="ReplicaSet",owner_is_controller="true"},
                    "replicaset", "$1", "owner_name", "(.+)"
                  )
                * on (namespace, replicaset) group_left(deployment)
                  label_replace(
                    kube_replicaset_owner{owner_kind="Deployment",owner_is_controller="true"},
                    "deployment", "$1", "owner_name", "(.+)"
                  )
              ) > 0
            for: 30s
            keep_firing_for: 2m
            labels:
              severity: warning
          - alert: K8sIncidentDeploymentReplicasUnavailable
            expr: >-
              (
                max by (namespace, deployment) (kube_deployment_spec_replicas)
                -
                max by (namespace, deployment) (kube_deployment_status_replicas_available)
              ) > 0
            for: 5m
            labels:
              severity: warning
          - alert: K8sIncidentServiceEndpointsUnavailable
            expr: >-
              (((max by (namespace, service) (kube_service_labels{label_k8s_incident_agent_io_monitor_selector="true"}) * on (namespace, service) max by (namespace, service) (kube_service_spec_type{type=~"ClusterIP|NodePort|LoadBalancer"} == 1)) * on (namespace, service) max by (namespace, service) (kube_service_info{cluster_ip!="None"} == 1)) and on (namespace, service) max by (namespace, service) (label_replace(kube_pod_labels{label_k8s_incident_agent_io_service!=""}, "service", "$1", "label_k8s_incident_agent_io_service", "(.+)"))) unless on (namespace, service) max by (namespace, service) ((kube_endpointslice_endpoints{ready="true"} > 0) * on (namespace, endpointslice) group_left(service) label_replace(kube_endpointslice_labels{label_kubernetes_io_service_name!=""}, "service", "$1", "label_kubernetes_io_service_name", "(.+)"))
            for: 30s
            labels:
              severity: warning
          - alert: K8sIncidentReadinessProbeFailure
            expr: >-
              max by (namespace, deployment) (
                max by (namespace, pod) (
                  (
                    (kube_pod_container_status_ready == bool 0)
                    * on (namespace, pod, container)
                      (kube_pod_container_status_running == 1)
                  )
                  * on (namespace, pod, container)
                    label_replace(
                      kube_pod_labels{label_k8s_incident_agent_io_readiness_container!="",label_k8s_incident_agent_io_readiness_slo="2m"} == 1,
                      "container", "$1", "label_k8s_incident_agent_io_readiness_container", "(.+)"
                    )
                )
                * on (namespace, pod) group_left(replicaset)
                  label_replace(
                    kube_pod_owner{owner_kind="ReplicaSet",owner_is_controller="true"},
                    "replicaset", "$1", "owner_name", "(.+)"
                  )
                * on (namespace, replicaset) group_left(deployment)
                  label_replace(
                    kube_replicaset_owner{owner_kind="Deployment",owner_is_controller="true"},
                    "deployment", "$1", "owner_name", "(.+)"
                  )
              ) > 0
            for: 2m
            labels:
              severity: warning
          - alert: K8sIncidentLivenessProbeRestart
            expr: >-
              max by (namespace, deployment) (
                max by (namespace, pod) (
                  (increase(kube_pod_container_status_restarts_total[5m]) > 0)
                  * on (namespace, pod, container)
                    label_replace(
                      kube_pod_labels{label_k8s_incident_agent_io_liveness_container!=""} == 1,
                      "container", "$1", "label_k8s_incident_agent_io_liveness_container", "(.+)"
                    )
                )
                * on (namespace, pod) group_left(replicaset)
                  label_replace(
                    kube_pod_owner{owner_kind="ReplicaSet",owner_is_controller="true"},
                    "replicaset", "$1", "owner_name", "(.+)"
                  )
                * on (namespace, replicaset) group_left(deployment)
                  label_replace(
                    kube_replicaset_owner{owner_kind="Deployment",owner_is_controller="true"},
                    "deployment", "$1", "owner_name", "(.+)"
                  )
              ) > 0
            for: 30s
            labels:
              severity: warning
          - alert: K8sIncidentPersistentVolumeClaimPending
            expr: >-
              max by (namespace, persistentvolumeclaim) (
                (kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1)
                * on (namespace, persistentvolumeclaim)
                  kube_persistentvolumeclaim_labels{label_k8s_incident_agent_io_pending_policy="immediate"}
              ) > 0
            for: 5m
            labels:
              severity: warning
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: k8s-incident-monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: k8s-incident-agent
data:
  alertmanager.yaml: |
    global:
      resolve_timeout: 1m
    route:
      receiver: agent-runtime
      group_by: ["alertname", "cluster", "namespace", "deployment", "service", "persistentvolumeclaim"]
      group_wait: 1s
      group_interval: 15s
      repeat_interval: 5m
    inhibit_rules:
      - source_matchers:
          - alertname=~"K8sIncidentImagePullBackOff|K8sIncidentCrashLoopBackOff|K8sIncidentReadinessProbeFailure|K8sIncidentLivenessProbeRestart"
        target_matchers:
          - alertname="K8sIncidentDeploymentReplicasUnavailable"
        equal: ["cluster", "namespace", "deployment"]
    receivers:
      - name: agent-runtime
        webhook_configs:
          - url: http://agent-runtime.k8s-incident-agent.svc.cluster.local:8000/api/v1/alerts/alertmanager
            send_resolved: true
            max_alerts: 0
            timeout: 10s
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/webhook/token
