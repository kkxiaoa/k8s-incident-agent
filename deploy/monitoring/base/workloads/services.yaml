apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: k8s-incident-monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: k8s-incident-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      protocol: TCP
      port: 9090
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: k8s-incident-monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: k8s-incident-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      protocol: TCP
      port: 9093
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: k8s-incident-monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: k8s-incident-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
    - name: telemetry
      protocol: TCP
      port: 8081
      targetPort: telemetry
