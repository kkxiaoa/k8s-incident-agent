apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../platform/kind-storage
patches:
  - path: prometheus-data.yaml
    target:
      version: v1
      kind: PersistentVolumeClaim
      name: prometheus-data
      namespace: k8s-incident-monitoring
  - path: prometheus-volume-permissions.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: prometheus
      namespace: k8s-incident-monitoring
images:
  - name: k8s-incident-agent-runtime
    newName: k8s-incident-agent-runtime
    digest: sha256:2b6d82c4191b9ed990cf8eaa8cf489e85cf6c8730d9ed89822e4de57e7b5b248
