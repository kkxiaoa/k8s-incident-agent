apiVersion: v1
kind: Namespace
metadata:
  name: k8s-incident-scenarios
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnostic-agent
  namespace: k8s-incident-scenarios
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: diagnostic-agent-read
  namespace: k8s-incident-scenarios
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: diagnostic-agent-read
  namespace: k8s-incident-scenarios
subjects:
  - kind: ServiceAccount
    name: diagnostic-agent
    namespace: k8s-incident-scenarios
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: diagnostic-agent-read
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: diagnostic-agent-storage-class-read
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: diagnostic-agent-storage-class-read
subjects:
  - kind: ServiceAccount
    name: diagnostic-agent
    namespace: k8s-incident-scenarios
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: diagnostic-agent-storage-class-read
