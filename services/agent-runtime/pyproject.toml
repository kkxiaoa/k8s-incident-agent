[project]
name = "k8s-incident-agent-runtime"
version = "0.1.0"
description = "Python agent runtime for K8s Incident Agent"
requires-python = ">=3.13.15,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "langchain==1.3.14",
    "langchain-deepseek==1.1.0",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.uv]
required-version = "==0.12.3"

[tool.uv.build-backend]
module-name = "k8s_incident_agent"

[tool.pytest.ini_options]
addopts = ["-m", "not live_model"]
asyncio_mode = "auto"
strict_config = true
strict_markers = true
testpaths = ["tests"]
markers = [
    "live_model: tests that explicitly call the configured model provider",
]

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
