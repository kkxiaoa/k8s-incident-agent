[project]
name = "k8s-incident-agent-runtime"
version = "0.1.0"
description = "Python agent runtime for K8s Incident Agent"
requires-python = ">=3.13.15,<3.14"
dependencies = [
    "aiohttp==3.14.3",
    "aiosqlite==0.22.1",
    "alembic==1.18.5",
    "argon2-cffi==25.1.0",
    "fastapi>=0.139,<1",
    "httpx>=0.28,<1",
    "langchain==1.3.14",
    "langchain-deepseek==1.1.0",
    "langgraph-checkpoint-sqlite==3.1.1",
    "kubernetes==36.0.3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "sqlalchemy[asyncio]==2.0.51",
    "uvicorn>=0.51,<1",
]

[project.scripts]
agent-runtime = "k8s_incident_agent.api:main"
patch-validator = "k8s_incident_agent.repair.api:main"
sandbox-executor = "k8s_incident_agent.execution.worker:main"
agent-runtime-openapi = "k8s_incident_agent.openapi:main"
model-compat = "k8s_incident_agent.model.compatibility:main"
runtime = "k8s_incident_agent.runtime.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.uv]
required-version = "==0.12.3"

[tool.uv.build-backend]
module-name = "k8s_incident_agent"

[tool.pytest.ini_options]
addopts = ["-m", "not live_model and not live_kind"]
asyncio_mode = "auto"
strict_config = true
strict_markers = true
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live_kind: tests that explicitly call the fixed local Kind cluster",
    "live_model: tests that explicitly call the configured model provider",
]

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
